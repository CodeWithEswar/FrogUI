name: Stage Maven artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version-file: '.node-version', cache: npm }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --ignore-scripts
      - run: sdkmanager 'platforms;android-36.1'
      - run: bash gradlew verifyArchitecture apiCheck testDebugUnitTest publishAllPublicationsToBuildRepository
      - uses: actions/upload-artifact@v4
        with:
          name: maven-staging
          path: build/maven/
# Stages reviewable artifacts only. Signing, remote upload, and GitHub Releases are separate.
