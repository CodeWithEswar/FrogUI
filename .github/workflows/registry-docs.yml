name: Registry and documentation data
on:
  pull_request:
    paths: ['registry/**', 'tools/**', 'docs/**', 'app/src/main/**', 'frogui-components/src/main/**', 'gradle/release.properties', 'package*.json', '.node-version', '.github/workflows/registry-docs.yml']
  push:
    branches: [main]
    paths: ['registry/**', 'tools/**', 'docs/**', 'app/src/main/**', 'frogui-components/src/main/**', 'gradle/release.properties', 'package*.json', '.node-version', '.github/workflows/registry-docs.yml']
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.node-version', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm --prefix docs ci --ignore-scripts
      - run: npm test
      - run: npm run docs:build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-metadata
          path: docs/dist/
